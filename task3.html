<!DOCTYPE html>
<html>
<head>
  <!-- task3 rolling dice -->
  <title>Dice Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    .dice {
      font-size: 80px;
      margin: 20px;
    }
    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      background-color: #333;
      color: #fff;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h2>🎲 Rolling Dice Game 🎲</h2>
  <div>
    <span id="dice1" class="dice">🎲</span>
    <span id="dice2" class="dice">🎲</span>
  </div>
  <button onclick="rollDice()">Roll Dice</button>
  <div id="result"></div>

  <script>
    function rollDice() {
      const dice1 = Math.floor(Math.random() * 6) + 1;
      const dice2 = Math.floor(Math.random() * 6) + 1;

      document.getElementById("dice1").textContent = getDiceEmoji(dice1);
      document.getElementById("dice2").textContent = getDiceEmoji(dice2);

      if (dice1 > dice2) {
        document.getElementById("result").textContent = "Player 1 Wins!";
      } else if (dice2 > dice1) {
        document.getElementById("result").textContent = "Player 2 Wins!";
      } else {
        document.getElementById("result").textContent = "It's a Draw!";
      }
    }

    function getDiceEmoji(num) {
      const diceEmojis = ["⚀","⚁","⚂","⚃","⚄","⚅"];
      return diceEmojis[num - 1];
    }
  </script>
</body>
</html>
